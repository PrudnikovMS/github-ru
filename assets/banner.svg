<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="GitHub RU — Полная русская локализация GitHub Desktop и GitHub.com">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#131922"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.22" cy="0.3" r="0.55">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="0.82" cy="0.72" r="0.5">
      <stop offset="0%" stop-color="#238636" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#238636" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="420" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="18" fill="url(#glowBlue)"/>
  <rect width="1280" height="420" rx="18" fill="url(#glowGreen)"/>
  <rect x="1" y="1" width="1278" height="418" rx="17" fill="none" stroke="#30363d" stroke-width="2"/>

  <!-- Subtle grid -->
  <g stroke="#21262d" stroke-width="1" opacity="0.6">
    <line x1="0" y1="105" x2="1280" y2="105"/>
    <line x1="0" y1="210" x2="1280" y2="210"/>
    <line x1="0" y1="315" x2="1280" y2="315"/>
    <line x1="320" y1="0" x2="320" y2="420"/>
    <line x1="640" y1="0" x2="640" y2="420"/>
    <line x1="960" y1="0" x2="960" y2="420"/>
  </g>

  <!-- Left badge & title -->
  <g transform="translate(76, 86)">
    <rect x="0" y="0" width="212" height="32" rx="16" fill="#161b22" stroke="#30363d"/>
    <circle cx="20" cy="16" r="6" fill="#3fb950"/>
    <text x="36" y="21" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600">MIT License • by prud</text>

    <text x="0" y="102" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="68" font-weight="800" letter-spacing="-1.5">GitHub <tspan fill="url(#accent)">RU</tspan></text>
    <text x="0" y="148" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="500">Русификатор GitHub Desktop и GitHub.com</text>
    <text x="0" y="186" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Без телеметрии • Мгновенное переключение EN | RU • Безопасен для кода и диффов</text>

    <!-- Feature pills -->
    <g transform="translate(0, 218)">
      <rect x="0" y="0" width="190" height="38" rx="10" fill="#161b22" stroke="#30363d"/>
      <text x="18" y="24" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600">GitHub Desktop</text>

      <rect x="206" y="0" width="224" height="38" rx="10" fill="#161b22" stroke="#30363d"/>
      <text x="224" y="24" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600">Расширение Chrome / Edge</text>

      <rect x="446" y="0" width="218" height="38" rx="10" fill="#161b22" stroke="#30363d"/>
      <text x="464" y="24" fill="#d2a8ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600">Tampermonkey Userscript</text>
    </g>
  </g>

  <!-- Right EN | RU Toggle Card -->
  <g transform="translate(886, 108)">
    <rect x="0" y="0" width="320" height="204" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="20" y="20" width="280" height="36" rx="8" fill="#0d1117" stroke="#21262d"/>
    <circle cx="38" cy="38" r="5" fill="#f85149"/>
    <circle cx="56" cy="38" r="5" fill="#d29922"/>
    <circle cx="74" cy="38" r="5" fill="#3fb950"/>

    <!-- EN | RU pill inside mockup -->
    <rect x="204" y="26" width="84" height="24" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="222" y="42" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700">EN</text>
    <rect x="246" y="28" width="40" height="20" rx="10" fill="#238636"/>
    <text x="258" y="42" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700">RU</text>

    <text x="24" y="92" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">Текущий репозиторий</text>
    <text x="24" y="122" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">3 изменённых файла</text>
    <rect x="24" y="142" width="272" height="38" rx="8" fill="#238636"/>
    <text x="72" y="166" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700">Зафиксировать в main</text>
  </g>
</svg>
